<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wi-Fi 接入准入认证 · Gatekeeper</title>
  <style>
    :root {
      --bg: #080c16;
      --card: #101727;
      --border: #22304c;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }
    .mock-switcher {
      width: 100%; max-width: 440px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #141c30;
      border: 1px solid #354675;
      border-radius: 12px;
    }
    .mock-switcher-title {
      font-size: 11.5px; color: #c7d2fe; font-weight: 600; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .mock-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .mock-pill {
      position: relative; overflow: hidden;
      border: 1px solid var(--border);
      background: #0b101d;
      color: #e2e8f0;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11.5px;
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.15s;
    }
    .mock-pill:active { transform: scale(0.95); }
    .mock-pill.active { background: #133154; border-color: var(--cyan); color: #fff; font-weight: 600; }

    .portal-card {
      width: 100%; max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      transition: border-color 0.25s ease;
    }
    .portal-card.is-paused { border-color: rgba(251, 113, 133, 0.55); }
    .portal-card.is-approved { border-color: rgba(52, 211, 153, 0.45); }
    .portal-card.alert-shake { animation: alertShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    @keyframes alertShake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }

    .header { text-align: center; margin-bottom: 18px; }
    .header h1 { margin: 12px 0 4px; font-size: 20px; font-weight: 700; }
    .header p { margin: 0; font-size: 13px; color: var(--muted); }

    .status-orb {
      width: 64px; height: 64px; margin: 0 auto;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid transparent;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s, border-color 0.2s;
    }
    .status-orb.pop { animation: orbPop 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes orbPop {
      0% { transform: scale(0.84); opacity: 0.6; }
      70% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    .status-orb svg { width: 32px; height: 32px; }
    .orb-cyan { background: rgba(56, 189, 248, 0.14); border-color: rgba(56, 189, 248, 0.4); color: var(--cyan); }
    .orb-amber { background: rgba(251, 191, 36, 0.14); border-color: rgba(251, 191, 36, 0.45); color: var(--amber); }
    .orb-green { background: rgba(52, 211, 153, 0.14); border-color: rgba(52, 211, 153, 0.45); color: var(--emerald); }
    .orb-rose { background: rgba(244, 63, 94, 0.18); border-color: rgba(251, 113, 133, 0.55); color: var(--rose); }

    .info-box {
      background: #0a0f1c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      margin-bottom: 16px;
      display: flex; flex-direction: column; gap: 5px;
      font-size: 12.5px;
    }
    .info-row { display: flex; justify-content: space-between; gap: 10px; }
    .info-k { color: var(--muted); }
    .info-v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; color: #e2e8f0; }

    .state-panel { display: flex; flex-direction: column; gap: 11px; animation: panelIn 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .state-banner {
      border-radius: 14px;
      padding: 15px 14px;
      font-size: 13.5px;
      line-height: 1.6;
      text-align: center;
    }
    .banner-amber { background: rgba(251, 191, 36, 0.11); border: 1px solid rgba(251, 191, 36, 0.38); color: #fde68a; }
    .banner-green { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(52, 211, 153, 0.4); color: #a7f3d0; }
    .banner-rose { background: rgba(225, 29, 72, 0.16); border: 1px solid rgba(251, 113, 133, 0.52); color: #fecdd3; }
    .paused-headline { font-size: 18px; font-weight: 800; color: #fff; display: block; margin-bottom: 6px; letter-spacing: 0.4px; }
    .paused-countdown {
      display: inline-block; margin-top: 8px; padding: 4px 12px;
      border-radius: 999px; background: rgba(251, 191, 36, 0.18);
      border: 1px solid rgba(251, 191, 36, 0.45); color: #fde68a;
      font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums;
    }

    label { font-size: 13px; color: #cbd5e1; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #090e1a;
      color: #fff;
      font-size: 14.5px;
      outline: none;
    }
    input:focus { border-color: var(--cyan); }

    .btn-submit, .btn-recheck {
      position: relative; overflow: hidden;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 14.5px; font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s;
    }
    .btn-submit { background: #0284c7; }
    .btn-submit:active, .btn-recheck:active { transform: scale(0.97); }
    .btn-submit:disabled, .btn-recheck:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-recheck {
      background: #172136;
      border: 1px solid var(--border);
      color: #e2e8f0;
      font-size: 13px; padding: 9px 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-recheck svg { width: 15px; height: 15px; }
    .spin { animation: spin360 0.6s linear infinite; }
    @keyframes spin360 { to { transform: rotate(360deg); } }

    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      transform: scale(0); pointer-events: none;
      animation: rippleOut 0.4s ease-out forwards;
    }
    @keyframes rippleOut {
      to { transform: scale(2.6); opacity: 0; }
    }

    .error-msg { color: var(--rose); font-size: 12px; text-align: center; margin: 0; }
    .live-tip { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 12px; }
  </style>
</head>
<body>
  <div id="mock-switcher" class="mock-switcher hidden">
    <div class="mock-switcher-title">
      <span>仿真手机身份切换</span>
      <button id="btn-new-phone" type="button" class="mock-pill">+ 全新手机接入</button>
    </div>
    <div id="mock-pills" class="mock-pills"></div>
  </div>

  <main id="portal-card" class="portal-card">
    <div class="header">
      <div id="status-orb" class="status-orb orb-cyan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      </div>
      <h1 id="portal-title">智慧网络准入认证</h1>
      <p id="portal-subtitle">请完成设备登记以获取无线互联网访问权限</p>
    </div>

    <div class="info-box">
      <div class="info-row"><span class="info-k">设备 MAC 地址</span><span id="dev-mac" class="info-v">识别中...</span></div>
      <div class="info-row"><span class="info-k">局域网 IP</span><span id="dev-ip" class="info-v">-</span></div>
      <div id="row-name" class="info-row hidden"><span class="info-k">设备备注/名称</span><span id="dev-name" class="info-v">-</span></div>
    </div>

    <form id="apply-form" class="state-panel hidden">
      <label for="input-name">使用者姓名 / 设备专属代号</label>
      <input id="input-name" type="text" maxlength="36" placeholder="例如：测试机_阿杰 / 我的电脑" required />
      <p id="apply-error" class="error-msg hidden"></p>
      <button id="btn-apply" type="submit" class="btn-submit">申请联网</button>
    </form>

    <div id="pending-panel" class="state-panel hidden">
      <div class="state-banner banner-amber">
        <strong>等待管理员审批中...</strong><br />
        <span id="pending-detail">您的名字与 MAC 已推送到控制台，通过后本页将自动放行。</span>
      </div>
    </div>

    <div id="approved-panel" class="state-panel hidden">
      <div class="state-banner banner-green">
        <strong id="approved-headline">已授权联网</strong><br />
        <span id="approved-detail">您的设备已获全速网络权限，可关闭此页面正常上网。</span>
      </div>
    </div>

    <div id="paused-panel" class="state-panel hidden">
      <div class="state-banner banner-rose">
        <span class="paused-headline">软路由已断网</span>
        <span id="paused-detail">当前设备的网络已被软路由管理员暂停，无法访问互联网，请联系管理员恢复联网。</span>
        <div id="paused-countdown-badge" class="paused-countdown hidden"></div>
      </div>
    </div>

    <button id="btn-recheck" type="button" class="btn-recheck" style="margin-top: 12px;">
      <svg id="recheck-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      <span id="recheck-text">刷新检查联网状态</span>
    </button>

    <div id="live-tip" class="live-tip">实时状态通道连接中...</div>
  </main>

  <script src="/portal.js"></script>
</body>
</html>
